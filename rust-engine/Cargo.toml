[package]
name = "clash-recompiled"
version = "0.1.0"
edition = "2021"
description = "Source-bound native Rust compilation of recovered battle routines"

[dependencies]
serde_json = "1"

[build-dependencies]
serde_json = "1"

[features]
checked-memory = []

[profile.release]
opt-level = 3
codegen-units = 16

[profile.dev]
opt-level = 0
debug-assertions = false
debug = 0
codegen-units = 16

