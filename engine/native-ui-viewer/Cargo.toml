[package]
name = "clash-native-ui-viewer"
version = "0.1.0"
edition = "2021"
description = "Rust playback of recovered original Clash SC5 display objects"

[features]
default = ["window"]
window = ["dep:minifb"]
# Browser painter. No window, filesystem, or wall clock.
wasm = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
fontdue = "0.9"
minifb = { version = "0.28", optional = true, default-features = false, features = ["x11"] }

[[bin]]
name = "clash-native-ui-viewer"
path = "src/main.rs"
required-features = ["window"]

[profile.release]
lto = "thin"
codegen-units = 1

