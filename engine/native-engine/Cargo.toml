[package]
name = "clash-native-core"
version = "0.1.0"
edition = "2021"
description = "Source-bound Rust ports of recovered Clash Royale native operations"

[dependencies]
serde_json = "1"

[lib]
name = "clash_native_core"
path = "src/lib.rs"

[[bin]]
name = "native-deck-probe"
path = "src/bin/native_deck_probe.rs"

[[bin]]
name = "native-oracle"
path = "src/bin/native_oracle.rs"

[[bin]]
name = "native-rl"
path = "src/bin/native_rl.rs"

[[bin]]
name = "deck-setup-probe"
path = "src/bin/deck_setup_probe.rs"

[[bin]]
name = "native-watch"
path = "src/bin/native_watch.rs"
