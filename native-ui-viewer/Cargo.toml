[package]
name = "clash-native-ui-viewer"
version = "0.1.0"
edition = "2021"
description = "Rust playback of recovered original Clash SC5 display objects"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
minifb = { version = "0.28", default-features = false, features = ["x11"] }

[profile.release]
lto = "thin"
codegen-units = 1

