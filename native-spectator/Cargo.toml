[package]
name = "clash-native-spectator"
version = "0.1.0"
edition = "2021"
description = "Read-only original-asset battle spectator for the recovered engine"

[dependencies]
clash-recompiled = { path = "../rust-engine" }
clash-native-ui-viewer = { path = "../native-ui-viewer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
minifb = { version = "0.28", default-features = false, features = ["x11"] }

[profile.release]
opt-level = 3
codegen-units = 16

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package.clash-recompiled]
opt-level = 3
