[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clash-royale-replay-pipeline"
version = "0.1.0"
description = "Loss-aware RoyaleAPI replay collection and Hero ability labeling."
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "Pillow>=10.0",
    "rich>=13.7",
]

[project.optional-dependencies]
detector-training = ["roboflow>=1.1"]
phone-ocr = ["rapidocr>=2.0"]

[project.scripts]
cr-replays = "cr_replay_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cr_replay_pipeline" = ["assets/*.png", "assets/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
