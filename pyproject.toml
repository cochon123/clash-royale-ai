[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clash-royale-replay-pipeline"
version = "0.1.0"
description = "Loss-aware RoyaleAPI replay collection and Hero ability labeling."
requires-python = ">=3.11"
dependencies = ["lxml>=5.0", "matplotlib>=3.8", "scikit-learn>=1.4"]

[project.scripts]
cr-replays = "cr_replay_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
