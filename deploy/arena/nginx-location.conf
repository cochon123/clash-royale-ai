# Include inside the existing calgarypermit.ca HTTPS server block.
location = /clashroyale {
    return 308 /clashroyale/;
}

# Content-addressed painter packs. manifest.json is the short-cache pointer;
# every other file name is a content hash. gzip_static serves the .gz siblings
# written next to JSON. .br siblings are present for a server with ngx_brotli
# (brotli_static on); this file does not enable that module.
location = /clashroyale/assets/manifest.json {
    alias /opt/clash-arena/current/deploy/arena/web-assets/manifest.json;
    gzip_static on;
    default_type application/json;
    add_header Cache-Control "public, max-age=60" always;
    add_header X-Content-Type-Options nosniff always;
}
location ^~ /clashroyale/assets/ {
    alias /opt/clash-arena/current/deploy/arena/web-assets/;
    gzip_static on;
    types {
        application/wasm wasm;
        application/json json;
        image/png png;
        image/webp webp;
        font/ttf ttf;
    }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /clashroyale/ {
    limit_req zone=arena_starts burst=3 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8800;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
}
