[package]
name = "clash-rust"
version = "0.1.0"
edition = "2021"
default-run = "clash-rust"
description = "Deterministic offline arena battle reconstruction"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }

[lib]
name = "clash_rust"
path = "src/lib.rs"
